<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta http-equiv="refresh" content="5;url=https://happyletsgo.fr" />
    <title>Happy Let's GO — Redirection</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        background: #000;
        color: #fff;
        -webkit-font-smoothing: antialiased;
      }

      .wrap {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }

      .card {
        max-width: 420px;
        width: 100%;
        padding: 32px 28px;
        border-radius: 20px;
        border: 2px solid #fbbf24;
        background: rgba(28, 28, 30, 0.96);
        box-shadow:
          0 12px 40px rgba(0, 0, 0, 0.45),
          0 0 24px rgba(251, 191, 36, 0.18);
      }

      .logo {
        font-size: 28px;
        font-weight: 800;
        letter-spacing: -0.5px;
        margin: 0 0 8px;
        background: linear-gradient(145deg, #fde047, #fbbf24);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .subtitle {
        margin: 0 0 24px;
        color: #8e8e93;
        font-size: 15px;
        line-height: 1.5;
      }

      .countdown {
        font-size: 48px;
        font-weight: 800;
        line-height: 1;
        margin: 0 0 8px;
        color: #fde047;
      }

      .countdown-label {
        margin: 0 0 28px;
        color: #aeaeb2;
        font-size: 14px;
        font-weight: 600;
      }

      .link {
        display: inline-block;
        padding: 14px 22px;
        border-radius: 14px;
        background: linear-gradient(145deg, #fde047, #fbbf24);
        color: #0a0a0a;
        font-size: 16px;
        font-weight: 800;
        text-decoration: none;
      }

      .link:active {
        opacity: 0.92;
      }

      .target {
        margin-top: 18px;
        font-size: 13px;
        color: #636366;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1 class="logo">Happy Let's GO</h1>
        <p class="subtitle">
          Cette page GitHub Pages est temporaire.<br />
          Vous allez être redirigé vers le site principal.
        </p>
        <p class="countdown" id="countdown" aria-live="polite">5</p>
        <p class="countdown-label">secondes restantes</p>
        <a class="link" href="https://happyletsgo.fr">Aller sur happyletsgo.fr</a>
        <p class="target">https://happyletsgo.fr</p>
      </div>
    </div>
    <script>
      (function () {
        var target = "https://happyletsgo.fr";
        var remaining = 5;
        var el = document.getElementById("countdown");

        var timer = window.setInterval(function () {
          remaining -= 1;
          if (el) el.textContent = String(Math.max(remaining, 0));
          if (remaining <= 0) {
            window.clearInterval(timer);
            window.location.replace(target);
          }
        }, 1000);
      })();
    </script>
  </body>
</html>
